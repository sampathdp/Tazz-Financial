name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # No env override here on purpose — `vite build` defaults to production
      # mode, which auto-loads frontend/.env.production from the repo. That
      # file is the single source of truth for VITE_API_URL; change it there,
      # not here, so there's only one place to update if the domain changes.
      - name: Audit frontend dependencies (high and above)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 60000
          local-dir: ./frontend/dist/
          server-dir: /
          state-name: .ftp-deploy-sync-state-frontend.json
          exclude: |
            **/.git*
            **/.git*/**
            api/**
            laravel/**
            .well-known/**
            cgi-bin/**

  deploy-backend:
    name: Build & Deploy Backend (Laravel)
    runs-on: ubuntu-latest
    # Runs after deploy-frontend so the two jobs don't open concurrent FTP
    # sessions (frontend action + two parallel=8 lftp mirrors) against the
    # same hosting account at once — that contention is what produced the
    # "Timeout (control socket)" failure.
    needs: deploy-frontend
    steps:
      # fetch-depth: 0 so the "new migrations" step below can diff the pushed
      # commit range (default shallow checkout has no history to compare).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, bcmath, pdo, pdo_mysql, tokenizer, xml, ctype, json, fileinfo, openssl, zip
          tools: composer:2.6.6

      # Install exactly what composer.lock pins (config.platform.php = 7.4.33 keeps it resolvable on this PHP),
      # so production runs the versions the test suite ran against, not a fresh unreviewed resolve.
      - name: Install composer dependencies (from composer.lock)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-audit

      # Informational for now: Laravel 8 has open advisories, so a blocking gate would stop every deploy until the
      # framework upgrade lands. Flip continue-on-error to false once `composer audit --locked` is clean.
      - name: Audit locked PHP dependencies
        working-directory: backend
        continue-on-error: true
        run: composer audit --locked

      - name: Clear any cached config (paths would be wrong on server)
        working-directory: backend
        run: |
          php artisan config:clear || true
          php artisan route:clear || true
          php artisan view:clear || true
          rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/packages.php bootstrap/cache/services.php

      - name: Prepare Laravel app folder (without public/)
        run: |
          mkdir -p deploy/laravel
          rsync -a --exclude='public' --exclude='node_modules' --exclude='tests' --exclude='.git' --exclude='.env' --exclude='.env.example' backend/ deploy/laravel/

      - name: Prepare Laravel public folder
        run: |
          mkdir -p deploy/api
          cp -r backend/public/. deploy/api/
          sed -i "s|__DIR__.'/../storage|__DIR__.'/../laravel/storage|g" deploy/api/index.php
          sed -i "s|__DIR__.'/../vendor|__DIR__.'/../laravel/vendor|g" deploy/api/index.php
          sed -i "s|__DIR__.'/../bootstrap|__DIR__.'/../laravel/bootstrap|g" deploy/api/index.php
          # Fake SCRIPT_NAME so Laravel doesn't strip /api/ from PATH_INFO
          # (index.php is deployed at /api/index.php but routes are prefixed /api)
          sed -i "s|<?php|<?php\n\$_SERVER['SCRIPT_NAME'] = '/index.php';\n\$_SERVER['SCRIPT_FILENAME'] = __DIR__ . '/index.php';\n\$_SERVER['PHP_SELF'] = '/index.php';\n|" deploy/api/index.php

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Excluding the *contents* of storage/framework/{cache,sessions,views} from
      # the mirror below (so compiled/cached files aren't re-uploaded every
      # deploy) means lftp never has a reason to create those directories on a
      # host where they don't already exist — Laravel then fails view
      # compilation with an InvalidArgumentException. The explicit mkdir calls
      # create the empty shells first; -f ignores the error if they already exist.
      - name: Deploy Laravel app to /laravel via lftp (parallel, resumable)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            set net:timeout 60;
            set ftp:passive-mode true;
            set mirror:parallel-transfer-count 8;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mkdir -p -f /laravel/storage/framework/cache/data;
            mkdir -p -f /laravel/storage/framework/sessions;
            mkdir -p -f /laravel/storage/framework/views;
            mkdir -p -f /laravel/storage/logs;
            mirror -R --parallel=8 --only-newer --no-perms --exclude-glob '.git*' --exclude-glob '.env*' --exclude-glob 'storage/logs/*' --exclude-glob 'storage/framework/cache/*' --exclude-glob 'storage/framework/sessions/*' --exclude-glob 'storage/framework/views/*' ./deploy/laravel /laravel;
            bye;
          "

      - name: Deploy Laravel public to /api via lftp (parallel, resumable)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:timeout 60;
            set ftp:passive-mode true;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mirror -R --parallel=8 --only-newer --no-perms ./deploy/api /api;
            bye;
          "

      # opcache-reset.php authenticates on the X-Ops-Token *header* only — a
      # ?token= query param is ignored (and would leak into access logs).
      - name: Recreate storage directories after deploy
        continue-on-error: true
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          sleep 3
          curl -sS -H "X-Ops-Token: $OPS_TOKEN" \
            "https://tazz-investment.salonflow.cloud/api/opcache-reset.php?action=fix-storage"

      # Only migrate when the pushed commits ADDED migration files — past
      # migration files are never replayed. `github.event.before` is the tip
      # before the push; on a first push / forced push / manual dispatch it is
      # missing or unreachable, so fall back to the parent of the new tip.
      - name: Detect new migration files in this push
        id: newmigs
        run: |
          BEFORE='${{ github.event.before }}'
          SHA='${{ github.sha }}'
          if [ -z "$BEFORE" ] || ! git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            BEFORE="$(git rev-parse -q --verify "$SHA^" || echo "$SHA")"
          fi
          files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" -- backend/database/migrations/ \
            | grep '\.php$' | sed 's#^backend/##' || true)
          echo "Range: $BEFORE..$SHA"
          echo "New / changed migration files:"
          echo "${files:-<none>}"
          if [ -n "$files" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "files<<__EOF__"
            echo "$files"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # Runs ONLY when this push added migration files. Never fails the deploy:
      # a migration error is surfaced as a warning and applied by hand later,
      # the release still completes. The endpoint runs
      # `migrate --force --path=<file>` for exactly the listed files (Laravel
      # still skips any already in the ledger); seeds are never triggered.
      - name: Run new database migrations
        if: steps.newmigs.outputs.has == 'true'
        continue-on-error: true
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
          NEW_MIGRATIONS: ${{ steps.newmigs.outputs.files }}
        run: |
          paths=$(printf '%s' "$NEW_MIGRATIONS" | paste -sd, -)
          echo "Applying migrations: $paths"
          out=$(curl -sS -w $'\n%{http_code}' -X POST -H "X-Ops-Token: $OPS_TOKEN" \
            --data-urlencode "paths=$paths" \
            "https://tazz-investment.salonflow.cloud/api/opcache-reset.php?action=migrate")
          code=$(printf '%s' "$out" | tail -n1)
          json=$(printf '%s' "$out" | sed '$d')
          echo "$json"
          if [ "$code" != "200" ]; then
            echo "::warning::migrate endpoint returned HTTP $code — migrations NOT applied, deploy continues"
            exit 0
          fi
          if printf '%s' "$json" | jq -e 'has("error")' >/dev/null 2>&1; then
            echo "::warning::a migration failed — see output above; deploy continues, apply it by hand"
            exit 0
          fi
          echo "migrations applied OK"

      - name: Reset OPcache after deploy
        continue-on-error: true
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -H "X-Ops-Token: $OPS_TOKEN" \
            "https://tazz-investment.salonflow.cloud/api/opcache-reset.php")
          echo "$response"
